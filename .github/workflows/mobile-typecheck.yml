name: MaarifaBooks Mobile Typecheck

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-typecheck.yml"
  push:
    branches:
      - "feature/maarifabooks-stitch-app-preview"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-typecheck.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npx tsc --noEmit
