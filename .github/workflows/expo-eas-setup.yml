name: Initialize Expo EAS project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mobile app branch
        uses: actions/checkout@v4
        with:
          ref: mobile-app-development
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize EAS project
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is missing from GitHub Actions secrets."
            exit 1
          fi
          npx --yes eas-cli@latest project:init --non-interactive

      - name: Save generated EAS project ID
        run: |
          if ! grep -q '"projectId"' mobile/app.json; then
            echo "EAS did not add a projectId to mobile/app.json."
            exit 1
          fi
          if git diff --quiet -- mobile/app.json; then
            echo "No app.json changes were produced; verify whether the EAS project was already linked."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/app.json
          git commit -m "chore(mobile): link Expo EAS project"
          git push origin HEAD:mobile-app-development
