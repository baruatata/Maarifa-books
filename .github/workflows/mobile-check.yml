name: Mobile app checks

on:
  push:
    branches:
      - mobile-app-development
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-check.yml"
      - ".github/workflows/eas-project-init.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-check.yml"
      - ".github/workflows/eas-project-init.yml"

permissions:
  contents: read
  actions: write

jobs:
  enable-eas-workflow:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable Expo EAS project workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT repos/${GITHUB_REPOSITORY}/actions/workflows/eas-project-init.yml/enable
          echo "Expo EAS project workflow has been enabled."

  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check Expo package compatibility
        run: npx expo install --check
      - name: TypeScript check
        run: npm run typecheck
      - name: Validate Expo configuration
        run: npx expo config --type public
      - name: Generate Android and iOS native projects
        run: npx expo prebuild --platform all --no-install --clean
